name: 'OpenBao Secret Fetcher'
description: 'Recupera i secret da OpenBao tramite AppRole e li salva in un file.'
inputs:
  baoUrl:
    description: 'URL di base di OpenBao (es. https://vault.mio-dominio.com)'
    required: true
  roleId:
    description: 'Il Role ID di AppRole'
    required: true
  secretId:
    description: 'Il Secret ID di AppRole'
    required: true
  secretPath:
    description: 'Il path dei secret (es. secret/data/mio_progetto)'
    required: true
  export-subdirectories:
    description: 'Se impostato a true, esporta anche i segreti presenti nelle sotto-cartelle del secretPath creando file .env.nomecartella'
    required: false
    default: 'false'
  outputFile:
    description: 'Il nome del file di output in cui salvare i secret'
    required: false
    default: 'openbao_secrets.env'
runs:
  using: 'node20'
  main: 'index.js'